<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Wheel Rim -->
  <circle cx="50" cy="50" r="44" stroke="#ffffff" stroke-width="6" />
  
  <!-- Inner Steering Rim -->
  <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Steering Wheel Spokes -->
  <!-- Left Spoke -->
  <path d="M12 50 L38 50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Right Spoke -->
  <path d="M62 50 L88 50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Bottom Left Spoke -->
  <path d="M26 74 L40 58" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <!-- Bottom Right Spoke -->
  <path d="M74 74 L60 58" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Hub -->
  <circle cx="50" cy="50" r="13" fill="#0a0a0a" stroke="#ffffff" stroke-width="4" />

  <!-- Perspective Road stretching through center -->
  <polygon points="50,40 56,88 44,88" fill="#ffffff" />
  <!-- Dashed Road Divider -->
  <line x1="50" y1="46" x2="50" y2="52" stroke="#0a0a0a" stroke-width="2" />
  <line x1="50" y1="58" x2="50" y2="66" stroke="#0a0a0a" stroke-width="2" />
  <line x1="50" y1="72" x2="50" y2="82" stroke="#0a0a0a" stroke-width="2.5" />
</svg>

