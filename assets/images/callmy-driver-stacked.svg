<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Steering Wheel + Road Icon -->
  <g transform="translate(20, 4) scale(0.6)">
    <!-- Outer Rim -->
    <circle cx="50" cy="50" r="44" stroke="#ffffff" stroke-width="7" />
    <!-- Spokes -->
    <path d="M12 50 L38 50" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <path d="M62 50 L88 50" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <path d="M26 74 L40 58" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M74 74 L60 58" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Center Hub -->
    <circle cx="50" cy="50" r="14" fill="#07090e" stroke="#ffffff" stroke-width="4.5" />
    <!-- Road Perspective -->
    <polygon points="50,40 57,86 43,86" fill="#ffffff" />
    <line x1="50" y1="46" x2="50" y2="52" stroke="#07090e" stroke-width="2.5" />
    <line x1="50" y1="58" x2="50" y2="66" stroke="#07090e" stroke-width="2.5" />
    <line x1="50" y1="72" x2="50" y2="82" stroke="#07090e" stroke-width="3" />
  </g>

  <!-- Stacked Brand Text -->
  <text x="50" y="77" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">CALLMY</text>
  <text x="50" y="90" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2" fill="#ffffff" text-anchor="middle">DRIVER</text>
</svg>

